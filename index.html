    </div>`;
  el.querySelectorAll('.stock-row').forEach(tr => tr.addEventListener('click', () => showPlanModal(tr.dataset.id)));
}
function showPlanModal(id) {
  const plans = Journal.plans();
  const p = plans.find(x => x.id === id);
  if (!p) return;
  const s = p.snapshot;
  const fillRows = (p.fills || []).map((f, i) => `<tr><td>${Fmt.esc(f.date)}</td><td>${Fmt.price(f.price, p.mkt)}</td><td>${Fmt.num(f.qty)}株</td><td><button class="btn small danger" data-del-fill="${i}">削除</button></td></tr>`).join('');
  const exitRows = (p.exits || []).map((f, i) => `<tr><td>${Fmt.esc(f.date)}</td><td>${Fmt.price(f.price, p.mkt)}</td><td>${Fmt.num(f.qty)}株</td><td><button class="btn small danger" data-del-exit="${i}">削除</button></td></tr>`).join('');
  const totalFillQty = (p.fills || []).reduce((a, f) => a + f.qty, 0);
  const totalExitQty = (p.exits || []).reduce((a, f) => a + f.qty, 0);
  Modal.show(`
    <h3>${p.ticker.replace('.T', '')} ${Fmt.esc(p.name)} — ${p.mode === 'swing' ? 'スイング' : '中長期'}</h3>
    <p class="muted" style="font-size:12px">計画: ${s.entries.map((e, i) => `E${i + 1} ${Fmt.price(e.price, p.mkt)}×${e.qty || '−'}`).join(' / ')}<br>
    損切り ${Fmt.price(s.sl, p.mkt)} / ${s.targets.map(t => `${t.label} ${t.trail ? 'トレール' : Fmt.price(t.price, p.mkt)}`).join(' / ')} / RR ${s.rr.toFixed(2)}（${s.verdict}）</p>
    <h2 style="font-size:13px;margin:10px 0 4px">約定（買い）記録 ${totalFillQty ? `— 合計${Fmt.num(totalFillQty)}株` : ''}</h2>
    <table class="tbl">${fillRows}</table>
    <div class="row" style="margin:6px 0">
      <input type="date" id="fillDate" value="${new Date().toISOString().slice(0, 10)}">
      <input type="number" id="fillPrice" placeholder="価格" style="width:100px">
      <input type="number" id="fillQty" placeholder="株数" style="width:90px">
      <button class="btn small" id="addFill">＋約定追加</button>
    </div>
    <h2 style="font-size:13px;margin:12px 0 4px">決済（売り）記録 ${totalExitQty ? `— 合計${Fmt.num(totalExitQty)}株` : ''}</h2>
    <table class="tbl">${exitRows}</table>
    <div class="row" style="margin:6px 0">
      <input type="date" id="exitDate" value="${new Date().toISOString().slice(0, 10)}">
      <input type="number" id="exitPrice" placeholder="価格" style="width:100px">
      <input type="number" id="exitQty" placeholder="株数" style="width:90px">
      <button class="btn small" id="addExit">＋決済追加</button>
    </div>
    <label class="chk" style="border:none"><input type="checkbox" id="followedChk" ${p.result && p.result.followed ? 'checked' : ''}><span>計画どおりに実行できた（IN/OUTとも）</span></label>
    <label class="fld">振り返りメモ<textarea id="planMemo" rows="2">${Fmt.esc(p.memo || '')}</textarea></label>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn danger" id="delPlan">プラン削除</button>
      <div class="row">
        <button class="btn" onclick="Modal.hide()">閉じる</button>
        ${totalExitQty > 0 && totalExitQty >= totalFillQty && totalFillQty > 0 ? '<button class="btn primary" id="closePlan">クローズ確定</button>' : '<button class="btn primary" id="savePlanEdit">保存</button>'}
      </div>
    </div>`);
  const save = () => { Journal.savePlans(plans); showPlanModal(id); renderPlans(); };
  document.getElementById('addFill').addEventListener('click', () => {
    const price = parseFloat(document.getElementById('fillPrice').value);
    const qty = parseInt(document.getElementById('fillQty').value);
    if (!price || !qty) { alert('価格と株数を入力してください'); return; }
    p.fills = p.fills || [];
    p.fills.push({ date: document.getElementById('fillDate').value, price, qty });
    p.status = 'active';
    save();
  });
  document.getElementById('addExit').addEventListener('click', () => {
    const price = parseFloat(document.getElementById('exitPrice').value);
    const qty = parseInt(document.getElementById('exitQty').value);
    if (!price || !qty) { alert('価格と株数を入力してください'); return; }
    p.exits = p.exits || [];
    p.exits.push({ date: document.getElementById('exitDate').value, price, qty });
    save();
  });
  document.querySelectorAll('[data-del-fill]').forEach(b => b.addEventListener('click', () => { p.fills.splice(+b.dataset.delFill, 1); if (!p.fills.length) p.status = 'draft'; save(); }));
  document.querySelectorAll('[data-del-exit]').forEach(b => b.addEventListener('click', () => { p.exits.splice(+b.dataset.delExit, 1); save(); }));
  document.getElementById('delPlan').addEventListener('click', () => {
    if (!confirm('このプランを削除しますか？')) return;
    plans.splice(plans.indexOf(p), 1);
    Journal.savePlans(plans);
    Modal.hide(); renderPlans();
  });
  const saveEdit = document.getElementById('savePlanEdit');
  if (saveEdit) saveEdit.addEventListener('click', () => {
    p.memo = document.getElementById('planMemo').value;
    Journal.savePlans(plans);
    Modal.hide(); renderPlans();
  });
  const closeBtn = document.getElementById('closePlan');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    const fx = p.mkt === 'US' ? (p.snapshot.usdjpy || DataHub.usdjpy()) : 1;
    const avgFill = p.fills.reduce((a, f) => a + f.price * f.qty, 0) / totalFillQty;
    const pnl = p.exits.reduce((a, f) => a + (f.price - avgFill) * f.qty, 0) * fx;
    const risk0 = (avgFill - p.snapshot.sl) * totalFillQty * fx;
    const r = risk0 > 0 ? pnl / risk0 : 0;
    p.result = { r, pnl, followed: document.getElementById('followedChk').checked, closedAt: Date.now() };
    p.memo = document.getElementById('planMemo').value;
    p.status = 'closed';
    Journal.savePlans(plans);
    Modal.hide(); renderPlans();
  });
}

/* ---------------- セルフテスト（?selftest=1） ---------------- */
function runSelftest() {
  const results = [];
  const T = (name, fn) => {
    try {
      const r = fn();
      if (r === true || r === undefined) results.push({ name, ok: true });
      else results.push({ name, ok: false, msg: String(r) });
    } catch (e) { results.push({ name, ok: false, msg: e.message }); }
  };
  const approx = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol || `expected ${b}, got ${a}`;

  // --- 指標 ---
  T('SMA基本', () => {
    const r = Ind.sma([1, 2, 3, 4, 5], 3);
    return r[0] === null && r[1] === null && approx(r[2], 2) === true && approx(r[4], 4) === true || JSON.stringify(r);
  });
  T('RSI: 単調上昇で100', () => {
    const c = Array.from({ length: 40 }, (_, i) => 100 + i);
    const r = Ind.rsi(c, 14);
    return approx(r[39], 100, 0.01) === true || 'rsi=' + r[39];
  });
  T('RSI: 値域0-100・先頭null', () => {
    const c = Array.from({ length: 60 }, (_, i) => 100 + Math.sin(i / 3) * 10);
    const r = Ind.rsi(c, 14);
    if (r[13] !== null) return '13番目はnullのはず';
    return r.slice(14).every(v => v >= 0 && v <= 100) || '値域外あり';
  });
  T('ATR: 一定レンジ', () => {
    const n = 50, bars = { o: [], h: [], l: [], c: [], v: [] };
    for (let i = 0; i < n; i++) { bars.o.push(100); bars.h.push(102); bars.l.push(98); bars.c.push(100); bars.v.push(1000); }
    const atr = Ind.atr(bars, 14);
    return approx(atr[n - 1], 4, 0.01) === true || 'atr=' + atr[n - 1];
  });
  T('MACD: 長さと初期null', () => {
    const c = Array.from({ length: 100 }, (_, i) => 100 + i * 0.5);
    const m = Ind.macd(c);
    return m.line.length === 100 && m.line[10] === null && m.line[99] !== null && m.hist[99] !== null || 'MACD構造異常';
  });
  // --- 呼値 ---
  T('呼値: 3000円以下は1円', () => Tick.sizeJP(2999) === 1 || String(Tick.sizeJP(2999)));
  T('呼値: 3002円→5円単位切下げ3000円', () => Tick.floor(3002, 'JP') === 3000 || String(Tick.floor(3002, 'JP')));
  T('呼値: 米国は1セント', () => approx(Tick.floor(12.3456, 'US'), 12.34) === true || String(Tick.floor(12.3456, 'US')));
  T('呼値: 12000円→10円単位', () => Tick.floor(12007, 'JP') === 12000 || String(Tick.floor(12007, 'JP')));
  // --- 合成データ生成 ---
  const mkBars = pricePath => {
    const b = { d: [], o: [], h: [], l: [], c: [], v: [] };
    let day = 0;
    for (const p of pricePath) {
      b.d.push(20250101 + day++);
      b.o.push(p * 0.998); b.h.push(p * 1.01); b.l.push(p * 0.99); b.c.push(p); b.v.push(100000);
    }
    return b;
  };
  const wave = [];
  for (let i = 0; i < 30; i++) wave.push(100 + i);            // 100→129 上昇
  for (let i = 0; i < 12; i++) wave.push(129 - i * 1.2);      // →114.6 押し
  for (let i = 0; i < 25; i++) wave.push(114.6 + i * 1.4);    // →148.2 上昇
  for (let i = 0; i < 8; i++) wave.push(148.2 - i * 1.1);     // →140.5 押し目形成中
  const waveBars = mkBars(wave);
  T('ZigZag: 交互のH/Lピボット', () => {
    const pv = ZigZag.detect(waveBars, 'swing');
    if (pv.length < 3) return 'ピボット不足: ' + pv.length;
    for (let i = 1; i < pv.length; i++) if (pv[i].type === pv[i - 1].type) return '同型連続';
    return true;
  });
  T('ZigZag: 末尾は仮ピボット', () => {
    const pv = ZigZag.detect(waveBars, 'swing');
    return pv[pv.length - 1].provisional === true || '末尾がprovisionalでない';
  });
  T('フィボ: スイング選択と押し率', () => {
    const pv = ZigZag.detect(waveBars, 'swing');
    const sw = Fibo.pickSwing(waveBars, pv, 'swing');
    if (!sw) return 'スイング未検出';
    if (sw.outOfRange) return '押し目レンジ外判定になった';
    if (!(sw.H.price > sw.L.price)) return 'H<=L';
    return sw.retr > 0.05 && sw.retr < 0.6 || 'retr=' + sw.retr;
  });
  T('フィボ: 水準の計算', () => {
    const lv = Fibo.levels({ price: 100 }, { price: 200 });
    return approx(lv.retr[0.5], 150) === true && approx(lv.retr[0.382], 161.8) === true
      && approx(lv.ext[1.618], 261.8) === true || JSON.stringify(lv.retr);
  });
  // --- プランエンジン ---
  const settings = { capital: 3000000, riskPct: 1, feePct: 0.1, defaultMode: 'swing' };
  T('プラン: 基本生成（JP）', () => {
    const p = PlanEngine.generate(waveBars, { mode: 'swing', mkt: 'JP', settings, info: null });
    if (p.error) return p.error;
    if (!(p.entries.length >= 1 && p.entries.length <= 3)) return 'entries数=' + p.entries.length;
    for (let i = 1; i < p.entries.length; i++) if (p.entries[i].price >= p.entries[i - 1].price) return 'エントリーが降順でない';
    if (!(p.sl < p.entries[p.entries.length - 1].price)) return 'SLが最深エントリー以上';
    if (!(p.targets[0].price >= p.entries[0].price)) return 'T1がE1未満';
    if (!(p.rr > 0)) return 'RR<=0';
    return true;
  });
  T('プラン: 単元株100株丸め（JP）', () => {
    const p = PlanEngine.generate(waveBars, { mode: 'swing', mkt: 'JP', settings, info: null });
    if (p.error) return p.error;
    return p.entries.every(e => e.qty % 100 === 0) || '100株単位でない';
  });
  T('プラン: 実リスク≦設定リスク', () => {
    const p = PlanEngine.generate(waveBars, { mode: 'swing', mkt: 'JP', settings, info: null });
    if (p.error) return p.error;
    if (p.totalQty === 0) return true; // サイズ0なら対象外
    return p.riskActual <= p.riskAmt * 1.02 || `risk ${p.riskActual} > ${p.riskAmt}`;
  });
  T('プラン: 米国株は1株単位＋円換算', () => {
    const p = PlanEngine.generate(waveBars, { mode: 'long', mkt: 'US', settings, info: null });
    if (p.error) return p.error;
    if (!p.entries.every(e => Number.isInteger(e.qty))) return '整数株でない';
    if (!p.targets.every(t => isFinite(t.price))) return 'ターゲットにNaN（T3計算不良）';
    if (!isFinite(p.rr)) return 'RRがNaN';
    return p.usdjpy > 0 || 'usdjpy未設定';
  });
  T('プラン: 資金不足時の代替案', () => {
    const tiny = { ...settings, capital: 100000, riskPct: 0.5 };
    const bigWave = mkBars(wave.map(p2 => p2 * 300)); // 値がさ株（4万円台）
    const p = PlanEngine.generate(bigWave, { mode: 'swing', mkt: 'JP', settings: tiny, info: null });
    if (p.error) return p.error;
    return p.totalQty === 0 && !!p.sizeNote || 'sizeNote=' + p.sizeNote + ' qty=' + p.totalQty;
  });
  T('プラン: 単元に届かない時は1本指値へ自動縮小', () => {
    const cap10 = { ...settings, capital: 10000000, riskPct: 1 };
    const midWave = mkBars(wave.map(p2 => p2 * 60)); // 6,000〜8,900円級
    const p = PlanEngine.generate(midWave, { mode: 'swing', mkt: 'JP', settings: cap10, info: null });
    if (p.error) return p.error;
    if (p.totalQty !== 100) return 'totalQty=' + p.totalQty;
    return !!p.sizeNote && p.sizeNote.includes('縮小') || 'sizeNote=' + p.sizeNote;
  });
  T('プラン: データ不足エラー', () => {
    const p = PlanEngine.generate(mkBars(wave.slice(0, 40)), { mode: 'swing', mkt: 'JP', settings, info: null });
    return !!p.error || 'エラーになるべき';
  });
  T('プラン: 下降トレンドで無理にプランを出さない', () => {
    const down = [];
    for (let i = 0; i < 100; i++) down.push(200 - i);
    const p = PlanEngine.generate(mkBars(down), { mode: 'swing', mkt: 'JP', settings, info: null });
    // エラー or 見送り推奨・警告付きならOK（無警告の推奨プランはNG）
    if (p.error) return true;
    return p.verdict.key === 'avoid' || p.warnings.length > 0 || '下降トレンドで無警告プラン';
  });
  T('プラン: ストップ高連続（ギャップ）でも破綻しない', () => {
    const gap = [];
    for (let i = 0; i < 60; i++) gap.push(100);
    for (let i = 0; i < 5; i++) gap.push(100 * Math.pow(1.15, i + 1));
    for (let i = 0; i < 10; i++) gap.push(gap[gap.length - 1] * 0.99);
    const p = PlanEngine.generate(mkBars(gap), { mode: 'swing', mkt: 'JP', settings, info: null });
    return true; // 例外を投げなければOK（エラー返却は許容）
  });
  // --- 取り込み ---
  T('取込: stooq CSV', () => {
    let csv = 'Date,Open,High,Low,Close,Volume\n';
    for (let i = 0; i < 40; i++) {
      const d = new Date(2026, 0, 1 + i).toISOString().slice(0, 10);
      csv += `${d},${100 + i},${101 + i},${99 + i},${100.5 + i},10000\n`;
    }
    const r = Importer.parse(csv);
    if (r.error) return r.error;
    return r.bars.d.length === 40 && r.bars.c[0] === 100.5 || 'rows=' + r.bars.d.length;
  });
  T('取込: 日本語日付コピペ＋逆順ソート', () => {
    let txt = '';
    for (let i = 39; i >= 0; i--) {
      const mo = i < 28 ? 2 : 3, day = i < 28 ? i + 1 : i - 27;
      txt += `2026年${mo}月${day}日\t${100 + i}\t${101 + i}\t${99 + i}\t${100.5 + i}\t5000\n`;
    }
    const r = Importer.parse(txt);
    if (r.error) return r.error;
    for (let i = 1; i < r.bars.d.length; i++) if (r.bars.d[i] <= r.bars.d[i - 1]) return '昇順でない';
    return true;
  });
  T('取込: 行不足エラー', () => {
    const r = Importer.parse('2026/1/1\t100\t101\t99\t100\t500');
    return !!r.error || 'エラーになるべき';
  });
  T('取込: 空文字エラー', () => !!Importer.parse('').error || 'エラーになるべき');
  // --- ユーティリティ ---
  T('percentile: 空配列で0', () => percentile(5, []) === 0 || String(percentile(5, [])));
  T('percentile: 最大値≈1', () => percentile(9, [1, 3, 5, 7, 9]) >= 0.99 || String(percentile(9, [1, 3, 5, 7, 9])));
  T('バックアップ: 形式', () => {
    const b = Store.backupObject();
    return b.app === 'trade-planner' && b.schema === DATA_SCHEMA && typeof b.data === 'object' || JSON.stringify(Object.keys(b));
  });
  // --- ジャーナル統計（スタブ差し替え） ---
  T('ジャーナル統計', () => {
    const orig = Journal.plans;
    Journal.plans = () => [
      { status: 'closed', result: { r: 2, followed: true } },
      { status: 'closed', result: { r: -1, followed: true } },
      { status: 'closed', result: { r: 1, followed: false } },
      { status: 'draft', result: null }
    ];
    const s = Journal.stats();
    Journal.plans = orig;
    if (!s) return '統計がnull';
    return approx(s.winRate, 2 / 3, 0.01) === true && approx(s.cumR, 2, 0.01) === true
      && approx(s.followRate, 2 / 3, 0.01) === true || JSON.stringify(s);
  });
  // --- セクターフロー（合成データ） ---
  T('セクターフロー: 強弱の順位', () => {
    const days = 320;
    const mkSeries = (name, drift, kind) => {
      const d = [], o = [], h = [], l = [], c = [], v = [];
      let p = 100;
      for (let i = 0; i < days; i++) {
        d.push(20240101 + i);
        p *= (1 + drift);
        o.push(p); h.push(p * 1.005); l.push(p * 0.995); c.push(p); v.push(1000000);
      }
      return { name, mkt: 'JP', kind, d, o, h, l, c, v };
    };
    const origMarket = DataHub.market;
    const origTier = Store.get('sectorTier.JP', null);
    DataHub.market = { series: {
      '1306.T': mkSeries('bench', 0.0005, 'bench'),
      'STRONG': mkSeries('強いセクター', 0.002, 'sector'),
      'FLAT': mkSeries('横ばい', 0.0005, 'sector'),
      'WEAK': mkSeries('弱いセクター', -0.001, 'sector'),
    } };
    SectorFlow.invalidate();
    const rows = SectorFlow.compute('JP');
    DataHub.market = origMarket;
    SectorFlow.invalidate();
    if (origTier === null) Store.remove('sectorTier.JP'); else Store.set('sectorTier.JP', origTier);
    if (rows.length !== 3) return 'セクター数=' + rows.length;
    const order = rows.map(r => r.t);
    return order[0] === 'STRONG' && order[2] === 'WEAK' || order.join(',');
  });

  // --- 結果表示 ---
  const pass = results.filter(r => r.ok).length;
  document.querySelector('main').innerHTML = `
    <div class="card">
      <h2>セルフテスト結果: ${pass}/${results.length} ${pass === results.length ? '✅ 全緑' : '❌ 失敗あり'}</h2>
      <table class="tbl">
        ${results.map(r => `<tr><td>${r.ok ? '✅' : '❌'} ${Fmt.esc(r.name)}</td><td style="white-space:normal;color:var(--danger)">${r.ok ? '' : Fmt.esc(r.msg || '')}</td></tr>`).join('')}
      </table>
    </div>`;
  document.title = `selftest ${pass}/${results.length}`;
  window.__selftest = { pass, total: results.length, results };
}

/* ---------------- 起動 ---------------- */
async function boot() {
  Store.migrate();
  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) { /* noop */ }
  }
  const isTest = new URLSearchParams(location.search).get('selftest') === '1';
  await DataHub.init();
  updateDataBadge();
  if (isTest) { runSelftest(); return; }
  if (!Store.get('meta', {}).consentAt) showConsent();
  UI.switchTo('sector');
}
boot();
</script>
</body>
